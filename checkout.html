<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css"/>
    <title>Rutgers Rugby | Checkout</title>
</head>
<body>
    <header class="catalogue_header">
        <div class="section_container catalogue_header_container">
            <div class="catalogue_header_text">
                <h1>Your Cart</h1>
                <p>Review your items before checkout</p>
            </div>
            <div class="catalogue_header_btns">
                <a href="index.html" class="btn icon_btn">
                    <i class="ri-home-4-line"></i>
                </a>
            </div>
        </div>
    </header>

    <section class="section_container checkout_page">
        <div class="checkout_grid">

            <!-- LEFT: CART ITEMS -->
            <div class="checkout_items">
                <div class="checkout_items_header">
                    <label class="checkout_checkbox">
                        <input type="checkbox" id="select-all" checked>
                        <span>All Items (<span id="checkout-items-count">0</span>)</span>
                    </label>
                </div>

                <div id="checkout-items-list">
                    <!-- checkout_item rows are rendered here by checkout.js -->
                </div>
                <template id="checkout-item-template">
  <div class="checkout_item">
    <label class="checkout_checkbox">
      <input type="checkbox" class="item-checkbox" checked>
    </label>
    <div class="checkout_item_image">
      <img alt="">
    </div>
    <div class="checkout_item_details">
      <h4></h4>
      <select class="checkout_item_size_select">
        <option value="S">Size S</option>
        <option value="M">Size M</option>
        <option value="L">Size L</option>
        <option value="XL">Size XL</option>
      </select>
      <div class="checkout_item_footer">
        <span class="checkout_item_price"></span>
        <div class="checkout_item_qty">
          <button class="qty_btn" data-action="decrease">−</button>
          <span class="qty_value"></span>
          <button class="qty_btn" data-action="increase">+</button>
        </div>
      </div>
    </div>
    <button class="checkout_item_remove">
      <i class="ri-delete-bin-line"></i>
    </button>
  </div>
</template>
                <p id="checkout-empty" style="display:none; padding: 2rem 0; text-align:center; color: var(--text-light);">
                    Your cart is empty. <a href="catalogue.html">Browse the catalogue</a> to add something.
                </p>
            </div>

            <!-- RIGHT: ORDER SUMMARY -->
            <div class="checkout_summary">
                <div class="summary_card">
                    <h3>Order Summary</h3>
                    <p class="summary_subtext">Review your total before you check out</p>

                    <div class="summary_thumbs" id="summary-thumbs">
                        <!-- thumbnails rendered by checkout.js -->
                    </div>

                    <div class="summary_row">
                        <span>Subtotal</span>
                        <span id="summary-subtotal">$0.00</span>
                    </div>
                    <div class="summary_row">
                        <span>Shipping</span>
                        <span>Free</span>
                    </div>
                    <div class="summary_row summary_total">
                        <span>Total</span>
                        <span id="summary-total">$0.00</span>
                    </div>

                    <button class="btn checkout_btn" id="checkout-btn">Checkout Now (0)</button>
                </div>

                <div class="summary_card">
                    <h3>We Accept</h3>
                    <div class="payment_icons">
                        <i class="ri-visa-line"></i>
                        <i class="ri-mastercard-line"></i>
                        <i class="ri-paypal-line"></i>
                        <i class="ri-apple-fill"></i>
                        <i class="ri-google-fill"></i>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <footer>
        <!-- same footer as index.html -->
    </footer>

    <script src="cart.js"></script>
    <script src="checkout.js"></script>
    <script src="main.js"></script>
</body>
</html>
